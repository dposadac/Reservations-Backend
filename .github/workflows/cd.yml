name: CD

# Despliega la API en Google Cloud Run. Requiere haber configurado previamente
# la infraestructura GCP y los secretos/variables del repositorio (ver DEPLOYMENT.md).
on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  SERVICE: reservations-api
  REPOSITORY: reservations
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Necesario para Workload Identity Federation.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --platform managed \
            --port 8080 \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars "ASPNETCORE_ENVIRONMENT=Production" \
            --set-secrets "ConnectionStrings__Postgres=reservations-db-connstring:latest"

      # Job diario RN-06 (Cloud Scheduler -> POST /api/event/complete-finished).
      # Idempotente: crea el job la primera vez y lo actualiza en adelante.
      # Solo se ejecuta si la variable de repositorio SETUP_SCHEDULER == 'true'.
      - name: Ensure daily scheduler job (RN-06)
        if: vars.SETUP_SCHEDULER == 'true'
        env:
          JOB_NAME: complete-finished-events
          SCHEDULE: ${{ vars.SCHEDULER_CRON || '0 3 * * *' }}
          TIME_ZONE: ${{ vars.SCHEDULER_TIMEZONE || 'America/Bogota' }}
          SCHED_SA: scheduler-invoker@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          RUN_URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')
          URI="${RUN_URL}/api/event/complete-finished"

          ACTION=create
          if gcloud scheduler jobs describe "${JOB_NAME}" --location "${REGION}" >/dev/null 2>&1; then
            ACTION=update
          fi

          gcloud scheduler jobs "${ACTION}" http "${JOB_NAME}" \
            --location "${REGION}" \
            --schedule "${SCHEDULE}" \
            --time-zone "${TIME_ZONE}" \
            --uri "${URI}" \
            --http-method POST \
            --oidc-service-account-email "${SCHED_SA}" \
            --oidc-token-audience "${RUN_URL}"
