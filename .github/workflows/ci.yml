name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Reservations-Backend.slnx

      - name: Build
        run: dotnet build Reservations-Backend.slnx -c Release --no-restore

      # Las pruebas de integración usan Testcontainers; los runners ubuntu-latest
      # traen Docker preinstalado, así que arrancan PostgreSQL sin configuración extra.
      - name: Test
        run: dotnet test Reservations-Backend.slnx -c Release --no-build --verbosity normal
